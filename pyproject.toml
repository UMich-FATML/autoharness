[project]
name = "autoagent"
version = "0.1.0"
description = "Autonomous agent engineering"
requires-python = ">=3.12"
dependencies = [
    "openai-agents",
    "pandas",
    "openpyxl",
    "numpy",
    "harbor",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = ">=3.12"

[tool.pixi.pypi-dependencies]
autoagent = { path = ".", editable = true }
